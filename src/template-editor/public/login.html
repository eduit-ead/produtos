<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Produção Visual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181a20;
      --panel-border: #252a33;
      --text: #e8ecf1;
      --muted: #8b95a5;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --input-bg: #111318;
      --input-border: #2a2f38;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, #1a1d24 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      padding: 40px 32px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      font-weight: 600;
      font-size: 1.25rem;
      color: var(--text);
      text-decoration: none;
    }

    .brand svg {
      width: 32px;
      height: 32px;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 600;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .error {
      margin-top: 14px;
      padding: 10px 12px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 0.9rem;
      display: none;
    }

    .error.visible { display: block; }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    button.loading .spinner { display: inline-block; }
    button.loading .text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="login-card">
    <a href="/" class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 2z" />
      </svg>
      Produção Visual
    </a>
    <h1>Entrar</h1>
    <p>Digite a senha de acesso para continuar.</p>
    <form id="loginForm">
      <label for="password">Senha</label>
      <input id="password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      <button id="submitBtn" type="submit">
        <span class="spinner"></span>
        <span class="text">Entrar</span>
      </button>
      <div id="error" class="error"></div>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
