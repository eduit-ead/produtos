<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coleções</title>
  <link rel="stylesheet" href="/collections.css">
</head>
<body>
  <div id="app">
    <header class="studio-header">
      <h1>Coleções</h1>
      <nav class="nav-links">
        <a href="/">Estúdio</a>
        <a href="/collections.html" class="active">Coleções</a>
        <a href="/cursos.html">Cursos</a>
        <a href="/batch.html">Produção em lote</a>
        <a href="/editor.html">Editor avançado</a>
      </nav>
    </header>

    <main class="collections-workspace">
      <section class="collections-section">
        <h2>Coleções configuradas</h2>
        <div id="collectionsList" class="collections-list"></div>
      </section>

      <section class="collections-section">
        <h2>Importar nova coleção</h2>
        <p class="hint">Envie um arquivo CSV, JSON ou XLSX. Depois edite a configuração gerada para ajustar mapeamentos, filtros e template.</p>
        <form id="importForm" class="import-form">
          <label>ID da coleção</label>
          <input type="text" id="importId" placeholder="minha-colecao" required>

          <label>Nome</label>
          <input type="text" id="importName" placeholder="Minha Coleção" required>

          <label>Arquivo</label>
          <input type="file" id="importFile" accept=".csv,.json,.xlsx" required>

          <button type="submit" class="primary">Importar</button>
        </form>
        <div id="status" class="status ready">Pronto</div>
      </section>
    </main>
  </div>

  <script src="/collections.js"></script>
</body>
</html>
