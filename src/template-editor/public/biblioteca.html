<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BwipoArt</title>
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/biblioteca.css">
</head>
<body>
  <header id="appHeader" class="app-header"></header>

  <main class="container">
    <h1 class="page-title">Biblioteca</h1>
    <p class="page-subtitle">Gerencie bases de conteúdo, templates e assets usados nas produções.</p>

    <div class="tabs">
      <div class="tab active" data-tab="finished">Peças finalizadas</div>
      <div class="tab" data-tab="bases">Bases de conteúdo</div>
      <div class="tab" data-tab="templates">Templates</div>
      <div class="tab" data-tab="assets">Assets</div>
      <div class="tab" data-tab="uploads">Uploads</div>
    </div>

    <section id="tab-finished" class="tab-panel active">
      <div class="action-bar">
        <a href="/criar.html" class="btn-primary">Nova imagem</a>
        <span class="spacer"></span>
        <input type="text" id="finishedSearch" placeholder="Buscar peças..." style="max-width:220px">
        <select id="finishedTemplateFilter" class="input" style="max-width:160px">
          <option value="">Todos os templates</option>
        </select>
        <select id="finishedSourceFilter" class="input" style="max-width:140px">
          <option value="">Todas as origens</option>
          <option value="criar">Criar imagem</option>
          <option value="batch">Produção em lote</option>
          <option value="migration">Migração</option>
        </select>
        <input type="date" id="finishedFrom" title="De" class="input" style="max-width:130px">
        <input type="date" id="finishedTo" title="Até" class="input" style="max-width:130px">
        <button type="button" id="btnFinishedFilter" class="btn-secondary">Filtrar</button>
      </div>
      <div id="finishedCount" class="hint" style="margin-bottom:12px"></div>
      <div id="finishedList" class="grid grid-4"></div>
      <div id="finishedPagination" class="pagination-bar"></div>
    </section>

    <section id="tab-bases" class="tab-panel">
      <div class="action-bar">
        <a href="/importar.html" class="btn-primary">Nova base de conteúdo</a>
        <span class="spacer"></span>
        <span id="basesCount" class="hint"></span>
      </div>
      <div id="basesList" class="grid grid-3"></div>
    </section>

    <section id="tab-templates" class="tab-panel">
      <div class="action-bar">
        <button type="button" id="btnNewTemplate" class="btn-primary">Novo template</button>
        <span class="spacer"></span>
        <a href="/editor.html" target="_blank" class="btn-secondary">Editor avançado</a>
      </div>
      <div id="templatesList" class="grid grid-4"></div>
    </section>

    <section id="tab-assets" class="tab-panel">
      <div class="action-bar">
        <label class="btn-primary">
          <input type="file" id="assetUpload" accept=".png,.jpg,.jpeg,.svg" style="display:none">
          Enviar asset
        </label>
        <span class="spacer"></span>
        <input type="text" id="assetSearch" placeholder="Buscar assets..." style="max-width:260px">
      </div>
      <div id="assetsList" class="grid grid-6"></div>
    </section>

    <section id="tab-uploads" class="tab-panel">
      <div class="action-bar">
        <button type="button" id="btnPickUpload" class="btn-primary">Enviar imagem</button>
        <span class="spacer"></span>
        <span id="uploadsCount" class="hint"></span>
      </div>
      <form id="uploadComposer" class="card upload-composer" hidden>
        <div id="uploadDrop" class="upload-drop">
          Arraste uma imagem PNG, JPG ou WebP, ou clique para escolher.
          <input type="file" id="uploadFile" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp">
        </div>
        <img id="uploadPreview" class="upload-preview" alt="Prévia da imagem" hidden>
        <label class="hint" for="uploadName">Nome amigável (opcional)</label>
        <input type="text" id="uploadName" class="input" maxlength="120" placeholder="Ex.: banner-pos-administracao">
        <div class="actions">
          <button type="submit" id="btnSendUpload" class="btn-primary" disabled>Enviar</button>
          <button type="button" id="btnCancelUpload" class="btn-secondary">Cancelar</button>
        </div>
        <p id="uploadError" class="hint upload-error" hidden></p>
      </form>
      <div id="uploadsList" class="grid grid-3"></div>
    </section>

    <div id="status" class="status ready">Pronto</div>
  </main>

  <script src="/shared.js"></script>
  <script src="/biblioteca.js"></script>
</body>
</html>
