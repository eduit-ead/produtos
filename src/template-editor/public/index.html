<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estúdio de Criação</title>
  <link rel="stylesheet" href="/studio.css">
</head>
<body>
  <div id="app">
    <header class="studio-header">
      <h1>Estúdio de Criação</h1>
      <nav class="nav-links">
        <a href="/" class="active">Estúdio</a>
        <a href="/cursos.html">Cursos</a>
        <a href="/batch.html">Produção em lote</a>
        <a href="/editor.html">Editor avançado</a>
      </nav>
    </header>

    <main class="studio-workspace">
      <section id="stageSelect" class="stage-select">
        <h2>Escolha um template</h2>
        <div id="templateCards" class="template-cards"></div>
      </section>

      <section id="stageEditor" class="stage-editor hidden">
        <aside class="form-panel">
          <div class="form-header">
            <button id="btnBack" class="secondary">Voltar</button>
            <button id="btnReset" class="secondary">Restaurar</button>
          </div>
          <h2 id="templateName">Template</h2>
          <form id="variablesForm" class="variables-form"></form>
          <div class="form-actions">
            <button id="btnDownload" class="primary">Baixar PNG</button>
          </div>
          <div id="status" class="status ready">Pronto</div>
        </aside>

        <section class="preview-panel">
          <div id="previewWrap" class="preview-wrap">
            <img id="previewImg" alt="Preview" class="preview-img hidden">
          </div>
        </section>
      </section>
    </main>
  </div>

  <script src="/studio.js"></script>
</body>
</html>
