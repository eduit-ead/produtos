services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      HOST: 0.0.0.0
      NODE_ENV: ${NODE_ENV:-production}
      APP_RUNTIME_DIR: /app/persistent
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      APP_ACCESS_PASSWORD: ${APP_ACCESS_PASSWORD:-}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_DIR: /app/persistent/output/ai-catalog
      AI_CATALOG_DIR: /app/persistent/output/ai-catalog
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - bwipoart_data:/app/persistent
    restart: unless-stopped

volumes:
  bwipoart_data:
